# Render Blueprint — 백엔드 컨테이너 배포. 대시보드에서 "New > Blueprint"로 이 레포 연결.
# 시크릿(DATABASE_URL·JWT_SECRET)은 커밋하지 말고 Render 대시보드에서 sync:false 값으로 입력.
services:
  - type: web
    name: runboard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
